# Statische Pruefung der Terraform-Konfiguration: fmt, validate, tflint, tfsec.
#
# Kein Terraform Cloud und kein Remote-Backend - deshalb "init -backend=false"
# und kein API-Token. Es wird hier auch nichts geplant oder angewendet: das
# braeuchte OpenStack-Credentials, die dieses Repo bewusst nicht kennt.

name: 'Terraform'

on:
  push:
  pull_request:
    branches: [ "main" ]
  release:
    types: [created]

permissions:
  contents: read

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest
    environment: production

    # Use the Bash shell regardless whether the GitHub Actions runner is ubuntu-latest, macos-latest, or windows-latest
    defaults:
      run:
        shell: bash

    steps:
    # Checkout the repository to the GitHub Actions runner
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    # Ohne Backend: es geht nur um Syntax und Provider-Schemata.
    - name: Terraform Init
      run: terraform init -backend=false
      working-directory: terraform

    # Checks that all Terraform configuration files adhere to a canonical format
    - name: Terraform Format
      run: terraform fmt -check
      working-directory: terraform

    # Validates the Terraform configuration files
    - name: Terraform Validate
      run: terraform validate
      working-directory: terraform

    # Setup and run TFLint
    - name: Setup TFLint
      uses: terraform-linters/setup-tflint@v4
      with:
        tflint_version: latest

    - name: Init TFLint
      run: tflint --init
      working-directory: terraform

    - name: Run TFLint
      run: tflint --recursive
      working-directory: terraform

    # Run tfsec security scanner
    - name: Run tfsec
      uses: aquasecurity/tfsec-action@v1.0.3
      with:
        working_directory: terraform
        soft_fail: false
# Packer-Checks: init, fmt und eine Validierung ohne Cloud-Zugriff.
#
# Die lokale Composite-Action unter .github/actions installiert Packer und
# prueft dabei selbst, ob das Binary laeuft - ein eigener "packer version"-Step
# hier waere nur eine Wiederholung davon.

name: 'Packer'

env:
  PACKER_VERSION: '1.14.3'

on:
  push:
  pull_request:
    branches: [ "main" ]
  release:
    types: [created]

permissions:
  contents: read

jobs:
  packer:
    name: 'Packer'
    runs-on: ubuntu-latest
    environment: production

    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup `packer` (local action)
      uses: ./.github/actions
      id: setup_packer
      with:
        version: ${{ env.PACKER_VERSION }}

    - name: Packer Init
      run: packer init packer

    - name: Packer Format
      run: packer fmt -check packer

    # -syntax-only: prueft die Templates ohne Cloud-Zugriff. Ein vollstaendiges
    # `packer validate` wuerde die OpenStack-Credentials brauchen, die dieses
    # Repo bewusst nicht kennt.
    - name: Packer Validate
      run: packer validate -syntax-only packer
